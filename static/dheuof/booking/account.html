<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<title>حجوزاتي | ضيوف</title>
<meta name="description" content="سجّل دخولك لبوابة الحجز: اطلب حجزاً لنفسك وتابع طلباتك."/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="stylesheet" href="/static/dheuof/colors_and_type.css"/>
<link rel="stylesheet" href="/static/dheuof/booking/booking.css"/>
<link rel="stylesheet" href="/static/dheuof/booking/account.css"/>
</head>
<body>
<header class="bk-top">
  <a class="bk-brand" href="/static/dheuof/booking/index.html">
    <span class="ar">ضيوف</span><span class="en">Dheuof</span>
  </a>
  <nav class="bk-nav">
    <a href="/static/dheuof/booking/index.html">← ابحث</a>
  </nav>
</header>

<main class="ac-page">

  <!-- الدخول أو التسجيل -->
  <section class="ac-card" id="gate" hidden>
    <h1>بوابة الحجز</h1>
    <p class="ac-sub">
      احجز لنفسك وتابع طلباتك. <strong>لا يُطلب رقم هويتك هنا</strong> —
      تُؤخذ عند الوصول من موظف المنشأة.
    </p>
    <div class="ac-field"><label for="g-client">رقم المنشأة</label>
      <input type="text" id="g-client" inputmode="numeric"/></div>
    <div class="ac-field"><label for="g-name">الاسم</label>
      <input type="text" id="g-name" autocomplete="name"/></div>
    <div class="ac-field"><label for="g-phone">الجوال</label>
      <input type="tel" id="g-phone" autocomplete="tel" placeholder="05…"/></div>
    <div class="ac-field"><label for="g-email">البريد (اختياري)</label>
      <input type="email" id="g-email" autocomplete="email"/></div>
    <div class="ac-field"><label for="g-password">كلمة المرور</label>
      <input type="password" id="g-password" autocomplete="current-password"/></div>
    <button class="bk-btn" id="g-submit" data-mode="login">دخول</button>
    <button class="ac-link" id="g-switch" type="button">لا حساب لك؟ أنشئ واحداً</button>
  </section>

  <!-- الحساب -->
  <section id="panel" hidden>
    <div class="ac-head">
      <h1>أهلاً <span id="who"></span></h1>
      <button class="ac-x" id="logout">خروج</button>
    </div>

    <div class="ac-card">
      <h2>اطلب حجزاً</h2>
      <div class="ac-grid">
        <div class="ac-field"><label for="b-room_type">النوع</label>
          <select id="b-room_type"></select></div>
        <div class="ac-field"><label for="b-guests">النزلاء</label>
          <input type="number" id="b-guests" min="1" max="20" value="2"/></div>
        <div class="ac-field"><label for="b-check_in">الوصول</label>
          <input type="date" id="b-check_in"/></div>
        <div class="ac-field"><label for="b-check_out">المغادرة</label>
          <input type="date" id="b-check_out"/></div>
      </div>
      <div class="ac-field"><label for="b-notes">ملاحظات</label>
        <textarea id="b-notes" rows="2" placeholder="طلبات خاصة…"></textarea></div>
      <button class="bk-btn" id="b-submit">أرسل الطلب</button>
      <p class="ac-note">طلبك يصل المنشأة وتؤكّده وتتواصل معك.</p>
    </div>

    <h2 class="ac-h2">طلباتي</h2>
    <div id="bookings"><div class="ac-empty">جارٍ التحميل…</div></div>
  </section>

</main>

<footer class="bk-foot"><span>ضيوف — منصّة إدارة وحجز المنشآت</span></footer>
<script src="/static/dheuof/booking/js/account.js"></script>
</body>
</html>
