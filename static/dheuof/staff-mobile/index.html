<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<title>ضيوف · تطبيق الموظفين</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#143A2E"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="ضيوف موظفون"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="description" content="تطبيق الموظفين الذكي — فندق ضيوف"/>
<link rel="manifest" href="/static/dheuof/staff-mobile/manifest.json"/>
<link rel="stylesheet" href="/static/dheuof/colors_and_type.css"/>
<link rel="stylesheet" href="/static/dheuof/staff-mobile/mobile.css"/>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="/static/dheuof/staff-mobile/ios-frame.jsx"></script>
<script type="text/babel" src="/static/dheuof/staff-mobile/Screens.jsx"></script>

<script type="text/babel">
function App() {
  const isMobile = window.matchMedia('(max-width: 500px)').matches ||
                   /iPhone|iPad|Android|Mobile/i.test(navigator.userAgent);
  if (isMobile) {
    return <StaffApp fullScreen={true}/>;
  }
  return (
    <div className="sm-stage-single">
      <div>
        <IOSDevice width={390} height={820}>
          <StaffApp/>
        </IOSDevice>
        <div className="sm-caption">
          <div className="ar">تطبيق الموظفين الذكي</div>
          <div className="en">Staff Mobile App · Dheuof Hotel</div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/static/dheuof/staff-mobile/sw.js')
    .catch(function(){});
}
</script>
</body>
</html>
