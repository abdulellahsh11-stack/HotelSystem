<!doctype html>
<html lang="ar" dir="rtl" data-screen-label="Reports">
<head>
<meta charset="utf-8"/>
<title>ضيوف · التقارير والتحليلات</title>
<meta name="viewport" content="width=1440, initial-scale=1"/>
<link rel="stylesheet" href="/static/dheuof/colors_and_type.css"/>
<link rel="stylesheet" href="/static/dheuof/shared/chrome.css"/>
<link rel="stylesheet" href="/static/dheuof/modules/11-kpis/reports.css"/>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="/static/dheuof/shared/chrome.jsx"></script>
<script type="text/babel" src="/static/dheuof/modules/11-kpis/Charts.jsx"></script>
<script type="text/babel" src="/static/dheuof/modules/11-kpis/Insights.jsx"></script>

<script type="text/babel">
const { useState } = React;
function App() {
  const [active, setActive] = useState("reports");
  return (
    <div className="dh-app">
      <NzSidebar active={active} onChange={setActive}/>
      <div>
        <NzTopBar placeholder="بحث في التقارير والمؤشرات..."/>
        <main className="dh-main">
          <NzPageHead
            eyebrow="١ — ٣٠ أبريل ٢٠٢٥"

            sub="رؤى الأداء · مؤشرات الإيرادات · تحليل نقاط القوة والضعف"
            actions={<>
              <button className="dh-btn is-secondary"><NzIcon.cal/>الشهر الحالي ▾</button>
              <button className="dh-btn is-primary"><NzIcon.download/>تصدير PDF</button>

          />

          <div className="rp-kpi">
            <div className="card">
              <span className="lbl" dangerouslySetInnerHTML={{__html: '<abbr class="dh-abbr" data-ar="الإيراد لكل غرفة متاحة" data-en="Revenue Per Available Room" data-meaning="إجمالي إيراد الإقامة ÷ عدد الغرف المتاحة — يقيس الأداء العام للفندق">REVPAR</abbr>'}}></span>
              <span className="lbl-ar">الإيراد لكل غرفة متاحة</span>
              <span className="v">٦٢٦</span>
              <span className="change up">+٧٪ <span className="lab">شهر/شهر</span></span>
            </div>
            <div className="card">
              <span className="lbl" dangerouslySetInnerHTML={{__html: '<abbr class="dh-abbr" data-ar="متوسط سعر الغرفة" data-en="Average Daily Rate" data-meaning="إفرادي إيراد الغرف ÷ عدد الغرف المبيعة — متوسط السعر المحصل للغرفة في الليلة">ADR</abbr>'}}></span>
              <span className="lbl-ar">متوسط سعر الغرفة</span>
              <span className="v">٧٢٠</span>
              <span className="change up">+١٢٪ <span className="lab">عن العام</span></span>
            </div>
            <div className="card">
              <span className="lbl" dangerouslySetInnerHTML={{__html: '<abbr class="dh-abbr" data-ar="نسبة الإشغال" data-en="Occupancy Rate" data-meaning="الغرف المبيعة ÷ إجمالي الغرف المتاحة × ١٠٠ — أهم مؤشر على صحّة الحجوزات">OCC</abbr>'}}></span>
              <span className="lbl-ar">نسبة الإشغال</span>
              <span className="v">٨٧٪</span>
              <span className="change up">+٤٪ <span className="lab">عن الموسم</span></span>
            </div>
            <div className="card">
              <span className="lbl" dangerouslySetInnerHTML={{__html: '<abbr class="dh-abbr" data-ar="الربح التشغيلي لكل غرفة متاحة" data-en="Gross Operating Profit Per Available Room" data-meaning="صافي الربح التشغيلي ÷ عدد الغرف المتاحة — يقيس الربحية الحقيقية بعد المصروفات">GOPPAR</abbr>'}}></span>
              <span className="lbl-ar">الربح التشغيلي</span>
              <span className="v">٤٢٤</span>
              <span className="change dn">−٢٪ <span className="lab">شهر/شهر</span></span>
            </div>
            <div className="card">
              <span className="lbl" dangerouslySetInnerHTML={{__html: '<abbr class="dh-abbr" data-ar="متوسط ليالي الإقامة" data-en="Average Length of Stay" data-meaning="مجموع ليالي الإقامة ÷ عدد الحجوزات — كلّما ارتفع قلت تكلفة تبديل الغرف">ALOS</abbr>'}}></span>
              <span className="lbl-ar">متوسط ليالي الإقامة</span>
              <span className="v">٢٫٤</span>
              <span className="change up">+٠٫٣ <span className="lab">عن أبريل ٢٤</span></span>
            </div>
          </div>

          <LineChart/>

          <div className="rp-2col">
            <div>
              <ChannelBars/>
            </div>
            <div className="dh-card" style={{height: "100%"}}>
              <div className="dh-card-head">
                <div>
                  <div className="ttl">أهم المصادر الجغرافية</div>
                  <div className="sub">Top guest origins</div>
                </div>
              </div>
              <div style={{padding: "0 20px 16px", display: "flex", flexDirection: "column", gap: 10}}>

                  { flag: "🇫🇷", n: "فرنسا",    pct:  5, count:  62 },
                ].map(c => (
                  <div key={c.n} style={{display: "grid", gridTemplateColumns: "24px 1fr 50px 50px", gap: 10, alignItems: "center", fontSize: 13}}>
                    <span style={{fontSize: 18, lineHeight: 1}}>{c.flag}</span>
                    <span>{c.n}</span>
                    <div style={{height: 6, background: "var(--sand)", borderRadius: 999, overflow: "hidden"}}>
                      <div style={{height: "100%", width: c.pct*2.4 + "%", background: "linear-gradient(to left, var(--brand-500), var(--brand-700))"}}></div>
                    </div>
                    <span style={{fontFamily: "var(--font-en)", fontVariantNumeric: "tabular-nums", fontWeight: 600, textAlign: "end"}}>{c.pct}٪</span>
                  </div>
                ))}
              </div>
            </div>
          </div>

          <div className="rp-ins-grid">
            <InsightCard
              kind="strength"
              title="جناح ٤٠٢ — الأعلى أداءً"
              en="Royal Suite 402 outperforms by 38%"
              value="٢٬٤٠٠ ر.س"
              change="+٣٨٪"
              recommendation="رفع سعر الجناح ٤٠٢ بنسبة ١٠٪ في عطلات نهاية الأسبوع، وتسويقه كحزمة شهر العسل."
            />
            <InsightCard
              kind="strength"
              title="ضيوف Booking.com — نمو متسارع"
              en="Booking.com inbound up 26%"
              value="٢٢٤ ضيف"
              change="+٢٦٪"
              recommendation="زيادة الميزانية الإعلانية على Booking.com بنسبة ١٥٪، وإطلاق عروض الإقامة الطويلة."
            />
            <InsightCard
              kind="weakness"
              title="ليالي الإقامة الفردية"
              en="Single-night stays dominate"
              value="٤٢٪"
              change="−"
              recommendation="حزمة 'ليلتان بسعر ١٫٧×' للضيوف القادمين عبر القنوات المباشرة، تخفض هذه النسبة إلى ٣٠٪ المستهدفة."
            />
            <InsightCard
              kind="weakness"
              title="فجوة إشغال الأحد والإثنين"
              en="Sun/Mon occupancy drops to 61%"
              value="٦١٪"
              change="−٢٦٪"
              recommendation="إطلاق تعرفة 'منتصف الأسبوع للأعمال' بخصم ١٥٪ على شركات الرياض، وعرض 'يوم مكتب' مع وجبة غداء داخل الجناح."

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

</html>
