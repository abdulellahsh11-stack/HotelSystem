<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"/>
<title>ضيوف · تطبيق الموظفين</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#143A2E"/>
<link rel="stylesheet" href="/static/dheuof/colors_and_type.css"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink-900);font-family:var(--font-ar);min-height:100vh}
  button{font-family:inherit;cursor:pointer}
  .top{display:flex;align-items:center;gap:14px;padding:14px 24px;border-bottom:1px solid var(--hairline);background:var(--paper);position:sticky;top:0;z-index:50}
  .back{padding:8px 14px;border-radius:999px;background:var(--surface-2);border:none;font-size:13px;color:var(--ink-700);text-decoration:none}
  .back:hover{background:var(--surface-3)}
  .ttl{font-family:var(--font-ar-display);font-size:18px;font-weight:600}
  .sub{font-family:var(--font-en);font-style:italic;font-size:12px;color:var(--gold-700);margin-inline-start:6px}
  .who{margin-inline-start:auto;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-600)}
  .who .av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--brand-700),var(--brand-900));color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}

  .wrap{max-width:760px;margin:0 auto;padding:18px 20px 90px}

  /* login */
  .login{max-width:380px;margin:60px auto;background:var(--white);border:1px solid var(--hairline);border-radius:18px;padding:34px 30px;box-shadow:0 14px 40px rgba(20,17,14,.07)}
  .login .ic{font-size:48px;text-align:center;margin-bottom:14px}
  .login h2{font-family:var(--font-ar-display);font-size:22px;text-align:center;margin-bottom:6px}
  .login p{font-size:13px;color:var(--fg-2);text-align:center;margin-bottom:22px}
  .fld{margin-bottom:14px}
  .fld label{display:block;font-size:12px;color:var(--ink-600);margin-bottom:6px}
  .fld select,.fld input,.fld textarea{width:100%;padding:11px 13px;border:1px solid var(--ink-200);border-radius:10px;font-family:inherit;font-size:14px;background:var(--white);color:var(--ink-900)}
  .fld textarea{resize:vertical;min-height:64px}
  .btn{width:100%;padding:12px;border:none;border-radius:10px;font-size:15px;font-weight:700;background:linear-gradient(135deg,var(--brand-700),var(--brand-900));color:#fff;transition:opacity .15s}
  .btn:hover{opacity:.92}
  .btn.gold{background:linear-gradient(135deg,var(--gold-500),var(--gold-700));color:var(--brand-900)}
  .btn.ghost{background:var(--surface-2);color:var(--ink-700)}
  .btn.sm{width:auto;padding:8px 16px;font-size:13px;border-radius:999px}
  .btn.danger{background:linear-gradient(135deg,#c0493b,#8f2f25)}

  /* tabs */
  .tabs{display:flex;gap:6px;background:var(--surface-2);padding:5px;border-radius:14px;margin-bottom:20px;overflow-x:auto}
  .tab{flex:1;min-width:96px;padding:10px 8px;border:none;background:transparent;border-radius:10px;font-size:13px;font-weight:600;color:var(--ink-500);white-space:nowrap;display:flex;flex-direction:column;align-items:center;gap:3px}
  .tab .ti{font-size:18px}
  .tab.on{background:var(--white);color:var(--brand-700);box-shadow:0 3px 10px rgba(20,17,14,.06)}
  .pane{display:none}
  .pane.on{display:block;animation:fade .25s}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .sechead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .sechead h3{font-family:var(--font-ar-display);font-size:17px}

  /* messaging */
  .chat-layout{display:grid;grid-template-columns:200px 1fr;gap:14px;height:480px}
  .roster{background:var(--white);border:1px solid var(--hairline);border-radius:14px;overflow-y:auto}
  .rost-item{display:flex;align-items:center;gap:9px;padding:11px 12px;border-bottom:1px solid var(--surface-3);cursor:pointer}
  .rost-item:hover{background:var(--surface-3)}
  .rost-item.on{background:var(--brand-50)}
  .rost-item .av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700;flex-shrink:0}
  .rost-item .nm{font-size:13px;font-weight:600}
  .rost-item .rl{font-size:11px;color:var(--fg-2)}
  .dot-on{width:8px;height:8px;border-radius:50%;background:#3B8772;margin-inline-start:auto}
  .dot-off{width:8px;height:8px;border-radius:50%;background:var(--ink-200);margin-inline-start:auto}
  .convo{background:var(--white);border:1px solid var(--hairline);border-radius:14px;display:flex;flex-direction:column}
  .convo-head{padding:12px 16px;border-bottom:1px solid var(--surface-3);font-weight:600;font-size:14px}
  .msgs{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
  .msg{max-width:74%;padding:9px 13px;border-radius:14px;font-size:13px;line-height:1.5}
  .msg.them{align-self:flex-start;background:var(--surface-2);border-bottom-right-radius:4px}
  .msg.me{align-self:flex-end;background:linear-gradient(135deg,var(--brand-700),var(--brand-800));color:#fff;border-bottom-left-radius:4px}
  .msg .t{font-size:10px;opacity:.6;margin-top:3px}
  .compose{display:flex;gap:8px;padding:11px;border-top:1px solid var(--surface-3)}
  .compose input{flex:1;padding:10px 13px;border:1px solid var(--ink-200);border-radius:999px;font-family:inherit;font-size:13px}

  /* tasks */
  .task{background:var(--white);border:1px solid var(--hairline);border-radius:14px;padding:16px 18px;margin-bottom:12px}
  .task.done{opacity:.62}
  .task-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:8px}
  .task .tt{font-weight:600;font-size:15px}
  .task.done .tt{text-decoration:line-through}
  .task .meta{font-size:12px;color:var(--fg-2);margin-top:3px;display:flex;gap:12px;flex-wrap:wrap}
  .pill{font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px}
  .pill.open{background:var(--gold-100);color:var(--gold-800)}
  .pill.prog{background:var(--brand-100);color:var(--brand-700)}
  .pill.closed{background:#e6f3ec;color:#2f7d54}
  .pri{font-size:11px;font-weight:700;padding:3px 10px;border-radius:999px}
  .pri.high{background:#fbe6e2;color:#b23121}
  .pri.mid{background:var(--gold-100);color:var(--gold-800)}
  .pri.low{background:var(--surface-2);color:var(--ink-600)}
  .task .desc{font-size:13px;color:var(--fg-1);line-height:1.6;margin:8px 0;padding:10px 12px;background:var(--surface-3);border-radius:10px}
  .task-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .clarify{margin-top:8px;border-top:1px dashed var(--hairline);padding-top:8px}
  .clar-item{font-size:12px;background:var(--brand-50);border-radius:8px;padding:7px 10px;margin-top:6px}
  .clar-item b{color:var(--brand-700)}

  /* housing */
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .room{background:var(--white);border:1px solid var(--hairline);border-radius:14px;padding:15px 16px}
  .room-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .room-no{font-family:var(--font-ar-display);font-size:16px;font-weight:600}
  .room .occ{font-size:12px;color:var(--fg-2);margin-bottom:10px}
  .checks{display:flex;flex-direction:column;gap:7px}
  .chk{display:flex;align-items:center;gap:9px;font-size:13px;padding:7px 10px;border:1px solid var(--surface-3);border-radius:9px;cursor:pointer;user-select:none}
  .chk.ok{background:#eef7f1;border-color:#cce8d6}
  .chk.bad{background:#fdeeec;border-color:#f3cfc9}
  .chk .box{width:20px;height:20px;border-radius:6px;border:2px solid var(--ink-300);display:grid;place-items:center;font-size:12px;flex-shrink:0}
  .chk.ok .box{background:#2f9d63;border-color:#2f9d63;color:#fff}
  .chk.bad .box{background:#d65745;border-color:#d65745;color:#fff}
  .room-foot{margin-top:11px;display:flex;gap:8px;align-items:center}
  .room-foot .score{font-size:12px;color:var(--fg-2);margin-inline-start:auto}

  .empty{text-align:center;padding:50px 20px;color:var(--fg-2)}
  .empty .ic{font-size:42px;margin-bottom:10px;opacity:.5}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink-900);color:#fff;padding:11px 22px;border-radius:999px;font-size:13px;z-index:200;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}

  /* modal */
  .modal-bg{position:fixed;inset:0;background:rgba(20,17,14,.45);display:none;align-items:center;justify-content:center;z-index:150;padding:20px}
  .modal-bg.show{display:flex}
  .modal{background:var(--white);border-radius:16px;padding:24px;width:100%;max-width:420px}
  .modal h3{font-family:var(--font-ar-display);font-size:18px;margin-bottom:16px}
  .modal-acts{display:flex;gap:10px;margin-top:18px}

  @media(max-width:640px){.chat-layout{grid-template-columns:1fr;height:auto}.roster{max-height:160px}.msgs{height:300px}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>

<header class="top">
  <a class="back" href="/static/dheuof/index.html">← الرئيسية</a>
  <div>
    <span class="ttl">تطبيق الموظفين</span>
    <span class="sub">Staff App · 16</span>
  </div>
  <div class="who" id="whoBox" style="display:none">
    <div class="av" id="whoAv">?</div>
    <span id="whoName"></span>
    <button class="btn sm danger" onclick="logout()">تسجيل الخروج</button>
  </div>
</header>

<!-- LOGIN -->
<div class="login" id="loginView">
  <div class="ic">📱</div>
  <h2>دخول الموظف</h2>
  <p>اختر اسمك للدخول إلى لوحة المهام والتراسل</p>
  <div class="fld">
    <label>الموظف</label>
    <select id="loginUser"></select>
  </div>
  <div class="fld">
    <label>الرمز السري (تجريبي: 0000)</label>
    <input id="loginPin" type="password" placeholder="••••" value="0000"/>
  </div>
  <button class="btn" onclick="doLogin()">دخول</button>
</div>

<!-- APP -->
<div class="wrap" id="appView" style="display:none">
  <div class="tabs">
    <button class="tab on" data-tab="chat"><span class="ti">💬</span>التراسل</button>
    <button class="tab" data-tab="tasks"><span class="ti">✅</span>المهام</button>
    <button class="tab" data-tab="housing"><span class="ti">🏠</span>أدوات السكن</button>
  </div>

  <!-- CHAT -->
  <div class="pane on" id="pane-chat">
    <div class="sechead"><h3>التراسل بين الموظفين</h3></div>
    <div class="chat-layout">
      <div class="roster" id="roster"></div>
      <div class="convo">
        <div class="convo-head" id="convoHead">اختر زميلاً للمحادثة</div>
        <div class="msgs" id="msgs"></div>
        <div class="compose">
          <input id="msgInput" placeholder="اكتب رسالة…" onkeydown="if(event.key==='Enter')sendMsg()"/>
          <button class="btn sm" onclick="sendMsg()">إرسال</button>
        </div>
      </div>
    </div>
  </div>

  <!-- TASKS -->
  <div class="pane" id="pane-tasks">
    <div class="sechead">
      <h3>المهام</h3>
      <button class="btn sm gold" onclick="openNewTask()">+ مهمة جديدة</button>
    </div>
    <div id="taskList"></div>
  </div>

  <!-- HOUSING -->
  <div class="pane" id="pane-housing">
    <div class="sechead">
      <h3>فحص أدوات السكن</h3>
      <button class="btn sm ghost" onclick="resetHousing()">إعادة التعيين</button>
    </div>
    <p style="font-size:12px;color:var(--fg-2);margin-bottom:14px">اضغط على كل أداة لتسجيل حالتها (سليمة / تحتاج صيانة). يتم حساب جاهزية الغرفة تلقائياً.</p>
    <div class="grid2" id="housingGrid"></div>
  </div>
</div>

<!-- NEW TASK MODAL -->
<div class="modal-bg" id="taskModal">
  <div class="modal">
    <h3>مهمة جديدة</h3>
    <div class="fld"><label>عنوان المهمة</label><input id="ntTitle" placeholder="مثال: تجهيز غرفة 204"/></div>
    <div class="fld"><label>إرسال إلى</label><select id="ntTo"></select></div>
    <div class="fld"><label>الأولوية</label>
      <select id="ntPri"><option value="high">عاجلة</option><option value="mid" selected>متوسطة</option><option value="low">عادية</option></select>
    </div>
    <div class="fld"><label>التفاصيل (إيضاح المهمة)</label><textarea id="ntDesc" placeholder="اشرح المطلوب بوضوح…"></textarea></div>
    <div class="modal-acts">
      <button class="btn" onclick="createTask()">إرسال المهمة</button>
      <button class="btn ghost" onclick="closeModal('taskModal')">إلغاء</button>
    </div>
  </div>
</div>

<!-- CLARIFY MODAL -->
<div class="modal-bg" id="clarModal">
  <div class="modal">
    <h3>طلب إيضاح</h3>
    <input type="hidden" id="clarTaskId"/>
    <div class="fld"><label>سؤالك للمُرسِل</label><textarea id="clarText" placeholder="ما الذي تريد توضيحه؟"></textarea></div>
    <div class="modal-acts">
      <button class="btn" onclick="submitClarify()">إرسال السؤال</button>
      <button class="btn ghost" onclick="closeModal('clarModal')">إلغاء</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ بيانات الموظفين ============ */
var STAFF = [
  { id:'u1', name:'أحمد الزهراني', role:'مشرف استقبال',  color:'#1B4D3D' },
  { id:'u2', name:'سارة القحطاني', role:'مديرة تدبير',    color:'#9A7430' },
  { id:'u3', name:'خالد العتيبي',  role:'فني صيانة',      color:'#266554' },
  { id:'u4', name:'منى الشهري',    role:'موظفة استقبال',  color:'#B68F40' },
  { id:'u5', name:'فهد الدوسري',   role:'أمن وسلامة',     color:'#143A2E' }
];
var LS = {
  cur:   'dh_staff_cur',
  msgs:  'dh_staff_msgs',
  tasks: 'dh_staff_tasks',
  house: 'dh_staff_house'
};
var me = null, activePeer = null;

function byId(id){ return STAFF.filter(function(s){return s.id===id})[0]; }
function initials(n){ var p=n.trim().split(/\s+/); return (p[0][0]||'')+(p[1]?p[1][0]:''); }
function esc(v){ return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function load(k,d){ try{ var v=JSON.parse(localStorage.getItem(k)); return v==null?d:v; }catch(e){ return d; } }
function save(k,v){ localStorage.setItem(k, JSON.stringify(v)); }
function now(){ var d=new Date(); return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0'); }
function toast(t){ var el=byEl('toast'); el.textContent=t; el.classList.add('show'); setTimeout(function(){el.classList.remove('show')},2200); }
function byEl(id){ return document.getElementById(id); }

/* ============ تسجيل الدخول / الخروج ============ */
function buildLoginOptions(){
  var sel=byEl('loginUser');
  sel.innerHTML = STAFF.map(function(s){ return '<option value="'+s.id+'">'+esc(s.name)+' — '+esc(s.role)+'</option>'; }).join('');
}
function doLogin(){
  var uid=byEl('loginUser').value;
  var pin=byEl('loginPin').value;
  if(pin!=='0000'){ toast('الرمز السري غير صحيح'); return; }
  me = byId(uid);
  save(LS.cur, me.id);
  enterApp();
}
function logout(){
  localStorage.removeItem(LS.cur);
  me=null; activePeer=null;
  byEl('appView').style.display='none';
  byEl('whoBox').style.display='none';
  byEl('loginView').style.display='block';
  toast('تم تسجيل الخروج');
}
function enterApp(){
  byEl('loginView').style.display='none';
  byEl('appView').style.display='block';
  byEl('whoBox').style.display='flex';
  byEl('whoAv').textContent=initials(me.name);
  byEl('whoAv').style.background='linear-gradient(135deg,'+me.color+',#0E2A22)';
  byEl('whoName').textContent=me.name;
  renderRoster(); renderTasks(); renderHousing(); buildTaskTargets();
}

/* ============ التبويبات ============ */
document.querySelectorAll('.tab').forEach(function(t){
  t.addEventListener('click', function(){
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('on')});
    document.querySelectorAll('.pane').forEach(function(x){x.classList.remove('on')});
    t.classList.add('on');
    byEl('pane-'+t.dataset.tab).classList.add('on');
  });
});

/* ============ التراسل ============ */
function convKey(a,b){ return [a,b].sort().join('|'); }
function renderRoster(){
  var el=byEl('roster');
  el.innerHTML = STAFF.filter(function(s){return s.id!==me.id}).map(function(s){
    var online = (s.id.charCodeAt(1)%2)===0; // عرض توضيحي للحالة
    return '<div class="rost-item'+(activePeer===s.id?' on':'')+'" onclick="openConv(\''+s.id+'\')">'+
      '<div class="av" style="background:linear-gradient(135deg,'+s.color+',#0E2A22)">'+esc(initials(s.name))+'</div>'+
      '<div><div class="nm">'+esc(s.name)+'</div><div class="rl">'+esc(s.role)+'</div></div>'+
      '<div class="'+(online?'dot-on':'dot-off')+'"></div></div>';
  }).join('');
}
function openConv(pid){
  activePeer=pid; renderRoster();
  var p=byId(pid);
  byEl('convoHead').textContent=p.name+' · '+p.role;
  renderMsgs();
}
function renderMsgs(){
  var box=byEl('msgs');
  if(!activePeer){ box.innerHTML=''; return; }
  var all=load(LS.msgs,{});
  var thread=all[convKey(me.id,activePeer)]||[];
  if(!thread.length){ box.innerHTML='<div class="empty"><div class="ic">💬</div>ابدأ المحادثة</div>'; return; }
  box.innerHTML=thread.map(function(m){
    return '<div class="msg '+(m.from===me.id?'me':'them')+'">'+esc(m.text)+'<div class="t">'+esc(m.at)+'</div></div>';
  }).join('');
  box.scrollTop=box.scrollHeight;
}
function sendMsg(){
  if(!activePeer){ toast('اختر زميلاً أولاً'); return; }
  var inp=byEl('msgInput'); var txt=inp.value.trim();
  if(!txt) return;
  var all=load(LS.msgs,{}); var key=convKey(me.id,activePeer);
  all[key]=all[key]||[];
  all[key].push({from:me.id, text:txt, at:now()});
  save(LS.msgs,all); inp.value=''; renderMsgs();
}

/* ============ المهام ============ */
function buildTaskTargets(){
  var sel=byEl('ntTo');
  sel.innerHTML = STAFF.filter(function(s){return s.id!==me.id}).map(function(s){
    return '<option value="'+s.id+'">'+esc(s.name)+' — '+esc(s.role)+'</option>';
  }).join('');
}
function seedTasks(){
  if(load(LS.tasks,null)!==null) return;
  save(LS.tasks,[
    { id:'t1', title:'تجهيز جناح 305 لوصول VIP', from:'u1', to:'u2', pri:'high', status:'open', desc:'ضيف وصول 3 عصراً — تجهيز كامل + ترتيب الترحيب.', clar:[], at:'09:12' },
    { id:'t2', title:'إصلاح تكييف غرفة 118', from:'u1', to:'u3', pri:'mid', status:'prog', desc:'النزيل أبلغ عن ضعف التبريد.', clar:[], at:'08:40' }
  ]);
}
function renderTasks(){
  seedTasks();
  var tasks=load(LS.tasks,[]);
  // المهام الموجهة لي أو الصادرة مني
  var mine=tasks.filter(function(t){return t.to===me.id||t.from===me.id});
  var el=byEl('taskList');
  if(!mine.length){ el.innerHTML='<div class="empty"><div class="ic">✅</div>لا توجد مهام</div>'; return; }
  el.innerHTML=mine.map(function(t){
    var inbound = t.to===me.id;
    var statusTxt = t.status==='open'?'مفتوحة':(t.status==='prog'?'قيد التنفيذ':'مغلقة');
    var statusCls = t.status==='open'?'open':(t.status==='prog'?'prog':'closed');
    var priTxt = t.pri==='high'?'عاجلة':(t.pri==='mid'?'متوسطة':'عادية');
    var fromN = byId(t.from)? byId(t.from).name : t.from;
    var toN   = byId(t.to)?   byId(t.to).name   : t.to;
    var acts='';
    if(t.status!=='closed'){
      if(inbound && t.status==='open') acts+='<button class="btn sm" onclick="setStatus(\''+t.id+'\',\'prog\')">بدء التنفيذ</button>';
      if(inbound) acts+='<button class="btn sm ghost" onclick="askClarify(\''+t.id+'\')">طلب إيضاح</button>';
      acts+='<button class="btn sm gold" onclick="setStatus(\''+t.id+'\',\'closed\')">إغلاق المهمة</button>';
    } else {
      acts+='<button class="btn sm ghost" onclick="setStatus(\''+t.id+'\',\'open\')">إعادة فتح</button>';
    }
    var clarHtml='';
    if(t.clar && t.clar.length){
      clarHtml='<div class="clarify">'+t.clar.map(function(c){
        return '<div class="clar-item"><b>'+esc(byId(c.by)?byId(c.by).name:c.by)+':</b> '+esc(c.q)+'</div>';
      }).join('')+'</div>';
    }
    return '<div class="task'+(t.status==='closed'?' done':'')+'">'+
      '<div class="task-top"><div><div class="tt">'+esc(t.title)+'</div>'+
        '<div class="meta"><span>من: '+esc(fromN)+'</span><span>إلى: '+esc(toN)+'</span><span>'+esc(t.at)+'</span></div></div>'+
        '<div style="display:flex;gap:6px;flex-direction:column;align-items:flex-end">'+
          '<span class="pill '+statusCls+'">'+statusTxt+'</span>'+
          '<span class="pri '+t.pri+'">'+priTxt+'</span></div></div>'+
      '<div class="desc">'+esc(t.desc)+'</div>'+
      clarHtml+
      '<div class="task-acts">'+acts+'</div></div>';
  }).join('');
}
function setStatus(id,st){
  var tasks=load(LS.tasks,[]);
  tasks.forEach(function(t){ if(t.id===id) t.status=st; });
  save(LS.tasks,tasks); renderTasks();
  toast(st==='closed'?'تم إغلاق المهمة':(st==='prog'?'بدأ التنفيذ':'أعيد فتح المهمة'));
}
function openNewTask(){ byEl('taskModal').classList.add('show'); }
function createTask(){
  var title=byEl('ntTitle').value.trim();
  var desc=byEl('ntDesc').value.trim();
  if(!title){ toast('أدخل عنوان المهمة'); return; }
  var tasks=load(LS.tasks,[]);
  tasks.unshift({ id:'t'+Date.now(), title:title, from:me.id, to:byEl('ntTo').value, pri:byEl('ntPri').value, status:'open', desc:desc, clar:[], at:now() });
  save(LS.tasks,tasks);
  byEl('ntTitle').value=''; byEl('ntDesc').value='';
  closeModal('taskModal'); renderTasks(); toast('تم إرسال المهمة');
}
function askClarify(id){ byEl('clarTaskId').value=id; byEl('clarText').value=''; byEl('clarModal').classList.add('show'); }
function submitClarify(){
  var id=byEl('clarTaskId').value; var q=byEl('clarText').value.trim();
  if(!q){ toast('اكتب سؤالك'); return; }
  var tasks=load(LS.tasks,[]);
  tasks.forEach(function(t){ if(t.id===id){ t.clar=t.clar||[]; t.clar.push({by:me.id,q:q,at:now()}); } });
  save(LS.tasks,tasks); closeModal('clarModal'); renderTasks(); toast('تم إرسال طلب الإيضاح');
}
function closeModal(id){ byEl(id).classList.remove('show'); }

/* ============ أدوات السكن ============ */
var HOUSE_TOOLS = ['مكيف الهواء','السخان','الإضاءة','الثلاجة','أثاث الغرفة','دورة المياه'];
var HOUSE_ROOMS = [
  { no:'سكن A-101', occ:'أحمد الزهراني · خالد العتيبي' },
  { no:'سكن A-102', occ:'فهد الدوسري' },
  { no:'سكن B-201', occ:'سارة القحطاني' },
  { no:'سكن B-202', occ:'منى الشهري' }
];
function renderHousing(){
  var state=load(LS.house,{});
  byEl('housingGrid').innerHTML=HOUSE_ROOMS.map(function(r,ri){
    var rstate=state[r.no]||{};
    var okCount=0;
    var checks=HOUSE_TOOLS.map(function(tool,ti){
      var st=rstate[tool]; // undefined | 'ok' | 'bad'
      if(st==='ok') okCount++;
      var cls=st==='ok'?'ok':(st==='bad'?'bad':'');
      var mark=st==='ok'?'✓':(st==='bad'?'✕':'');
      return '<div class="chk '+cls+'" onclick="toggleTool(\''+r.no+'\',\''+tool+'\')">'+
        '<div class="box">'+mark+'</div><span>'+esc(tool)+'</span></div>';
    }).join('');
    var checked=Object.keys(rstate).length;
    return '<div class="room"><div class="room-top"><div class="room-no">'+esc(r.no)+'</div>'+
      '<span class="pill '+(okCount===HOUSE_TOOLS.length?'closed':(checked?'prog':'open'))+'">'+okCount+'/'+HOUSE_TOOLS.length+'</span></div>'+
      '<div class="occ">🛏 '+esc(r.occ)+'</div>'+
      '<div class="checks">'+checks+'</div>'+
      '<div class="room-foot"><span class="score">جاهزية: '+Math.round(okCount/HOUSE_TOOLS.length*100)+'٪</span></div></div>';
  }).join('');
}
function toggleTool(room,tool){
  var state=load(LS.house,{});
  state[room]=state[room]||{};
  var cur=state[room][tool];
  // دورة: غير محدد → سليم → صيانة → غير محدد
  if(cur===undefined) state[room][tool]='ok';
  else if(cur==='ok') state[room][tool]='bad';
  else delete state[room][tool];
  save(LS.house,state); renderHousing();
}
function resetHousing(){ localStorage.removeItem(LS.house); renderHousing(); toast('تمت إعادة التعيين'); }

/* ============ إقلاع ============ */
buildLoginOptions();
(function(){
  var cur=load(LS.cur,null);
  if(cur && byId(cur)){ me=byId(cur); enterApp(); }
})();
</script>
